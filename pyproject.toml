[project]
name = "passvault"
version = "0.1.0"
description = "A local-first TUI password manager for Linux."
authors = [{name = "Senume"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["password-manager", "tui", "cli", "security"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=41.0",
    "argon2-cffi>=23.0",
    "appdirs>=1.4",
    "textual>=0.60",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
passvault = "passvault_tui.app:run"

[project.urls]
Homepage = "https://github.com/Senume/PassVault"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["passvault_tui*", "passvault_core*", "utils*"]

[tool.setuptools.package-data]
passvault_tui = ["style.css"]
